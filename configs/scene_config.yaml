paths:
  objects_dir:     "assets/objects"
  cc_textures_dir: "assets/cc_textures"
  haven_dir:       "assets/haven"
  output_hdf5_dir: "output/hdf5"
  output_bop_dir:  "output/bop"

dataset:
  num_scenes:            3        # keep low for local testing, 1000+ for actual dataset
  objects_per_scene_min: 5
  objects_per_scene_max: 6

objects:
  pool:
    - "006_mustard_bottle"
    - "025_mug"
    - "035_power_drill"
    - "002_master_chef_can"
    - "004_sugar_box"
    - "051_large_clamp"
    - "016_pear"
    - "021_bleach_cleanser"

render:
  image_width:      640
  image_height:     480
  focal_length_mm:  35
  noise_threshold:  0.05     # 0.01-0.02 for better quality renders
  max_samples:      64       # 128-256 for better quality renders
  use_gpu:          false    # set true for better quality renders
  denoiser:         "INTEL"

camera:
  dist_min:              0.5
  dist_max:              1.5
  height_min:            0.3
  height_max:            1.2
  inplane_rot_range:     0.3
  max_sampling_attempts: 50

physics:
  min_simulation_time:   2
  max_simulation_time:   8
  check_object_interval: 1

object_placement:
  drop_x_range:        [-0.4, 0.4]
  drop_y_range:        [-0.3, 0.3]
  drop_z_min:          0.2
  drop_z_max:          0.5
  upright_probability: 0.6

lighting:
  energy_min: 200
  energy_max: 800
  x_range:    [-2, 2]
  y_range:    [-2, 2]
  z_range:    [2, 4]

room:
  floor_scale: [3, 3, 1]
  wall_scale:  [3, 2, 1]
  table_scale: [1.0, 0.8, 1]
  table_height: 0.0